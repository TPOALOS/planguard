[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "planguard"
version = "1.0.0"
description = "Report risky changes in a Terraform plan (JSON) before apply: destroys, open ports, public buckets, encryption off. Never runs terraform. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["terraform", "security", "devops", "infrastructure-as-code", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/planguard"

[project.scripts]
planguard = "planguard:main"

[tool.setuptools]
py-modules = ["planguard"]
